<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#080b18;--panel:#101629;--muted:#75809f;--cyan:#5cf4e8;--pink:#ff5eae;--yellow:#ffe58a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#121a33 0,#090d1c 48%,#070914 100%);color:#f3f5ff;font-family:'Space Grotesk',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:grid;place-items:center;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
#app{width:min(100%,480px,calc((100dvh - 114px)*.6));position:relative;filter:drop-shadow(0 24px 70px #0009)}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:30px;height:30px;display:grid;place-items:center;border:1px solid #5cf4e866;background:#5cf4e811;color:var(--cyan);font-size:16px;transform:rotate(45deg);border-radius:8px}.brand-mark span{transform:rotate(-45deg)}.brand-name{font-size:12px;letter-spacing:2.5px;font-weight:700}.brand-sub{font:9px 'DM Mono',monospace;color:#75809f;letter-spacing:1.5px;margin-top:3px}.toolbar{display:flex;gap:8px}.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid #ffffff1a;background:#ffffff08;color:#cbd2e9;font-size:15px;cursor:pointer;display:grid;place-items:center;transition:.2s}.icon-btn:hover{border-color:#5cf4e877;color:var(--cyan);background:#5cf4e811}.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.gamebox{position:relative;width:100%;aspect-ratio:3/5;max-height:calc(100dvh - 94px);border:1px solid #97a5d229;border-radius:16px;overflow:hidden;background:#080b18;box-shadow:inset 0 0 0 1px #ffffff08,0 0 48px #20295733}
canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
.scanlines{position:absolute;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,#050712 4px);mix-blend-mode:multiply}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:25px;background:linear-gradient(180deg,#080b1866,#080b18aa);backdrop-filter:blur(3px);transition:opacity .25s}.overlay.hidden{opacity:0;pointer-events:none}.dialog{width:100%;max-width:330px;text-align:center;padding:28px 22px 24px;border:1px solid #93a2d02b;border-radius:18px;background:linear-gradient(145deg,#131a30ed,#0d1225ed);box-shadow:0 18px 70px #0008, inset 0 1px #ffffff0a;position:relative;overflow:hidden}.dialog:before{content:'';position:absolute;left:15%;right:15%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 16px #5cf4e8}.eyebrow{font:10px 'DM Mono',monospace;letter-spacing:3px;color:var(--cyan);text-transform:uppercase}.game-title{font-size:clamp(34px,10vw,46px);font-weight:700;letter-spacing:-2px;line-height:.96;margin:13px 0 8px;text-shadow:0 0 28px #5cf4e833}.game-title em{font-style:normal;color:var(--cyan)}.dialog p{font-size:13px;line-height:1.55;color:#aab3cf;margin:14px auto 20px;max-width:260px}.play-btn{width:100%;height:48px;border:0;border-radius:10px;background:var(--cyan);color:#07121b;font:700 12px 'DM Mono',monospace;letter-spacing:1.5px;cursor:pointer;box-shadow:0 5px 25px #5cf4e82b;transition:transform .15s,filter .15s}.play-btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.play-btn:active{transform:translateY(1px)}.controls-hint{margin-top:15px;color:#7e89a8;font:10px 'DM Mono',monospace;letter-spacing:.3px}.controls-hint b{color:#d8def2;font-weight:500}.results{display:flex;justify-content:center;gap:28px;margin:17px 0 20px}.result-num{font:20px 'DM Mono',monospace;color:#fff}.result-label{font:9px 'DM Mono',monospace;letter-spacing:1px;color:#7e89a8;margin-top:5px}
.footer{height:32px;display:flex;justify-content:space-between;align-items:end;padding:0 6px;color:#626d8b;font:9px 'DM Mono',monospace;letter-spacing:.4px}.footer span:last-child{color:#7b86a3}
@media(max-height:700px){body{padding-top:max(5px,env(safe-area-inset-top));padding-bottom:max(5px,env(safe-area-inset-bottom))}#app{width:min(100%,480px,calc((100dvh - 99px)*.6))}.topbar{height:43px;padding-bottom:6px}.gamebox{max-height:calc(100dvh - 75px);border-radius:12px}.footer{height:24px}.dialog{padding:21px 20px 19px}}
@media(min-width:700px){#app{width:min(100%,440px,calc((100dvh - 120px)*.6))}.topbar{height:58px}.gamebox{max-height:calc(100dvh - 100px)}}

<body>
<main id="app" aria-label="Juego arcade Neon Vanguard">
  <header class="topbar"><div class="brand"><div class="brand-mark"><span>✦</span></div><div><div class="brand-name">NEON VANGUARD</div><div class="brand-sub">SISTEMA DE DEFENSA · 2086</div></div></div><div class="toolbar"><button class="icon-btn" id="soundBtn" aria-label="Activar o desactivar sonido" title="Sonido">♫</button><button class="icon-btn" id="pauseBtn" aria-label="Pausar juego" title="Pausar" disabled>Ⅱ</button></div></header>
  <section class="gamebox" id="gamebox" aria-label="Zona de juego">
    <canvas id="game" width="480" height="800" aria-label="Juego de naves. Arrastra para moverte; disparas automáticamente."></canvas><div class="scanlines"></div><div class="vignette"></div>
    <div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>
  </section>
  <footer class="footer"><span>◀ ARRASTRA PARA MOVERTE</span><span>DISPARO AUTOMÁTICO ▶</span></footer>
</main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),dialog=document.querySelector('#dialog'),pauseBtn=document.querySelector('#pauseBtn'),soundBtn=document.querySelector('#soundBtn'),W=480,H=800;
const C={cyan:'#5cf4e8',pink:'#ff5eae',yellow:'#ffe58a',white:'#f4f6ff',muted:'#8290b2',red:'#ff5877'};
let mode='menu',last=0,score=0,best=Number(localStorage.getItem('nvBest')||0),wave=1,lives=3,shots=[],enemies=[],enemyShots=[],particles=[],stars=[],pickups=[],boss=null,spawnLeft=0,spawnTimer=0,fireTimer=0,elapsed=0,shake=0,flash=0,pointerDown=false,pointer={x:W/2,y:H-110},target={x:W/2,y:H-110},player={x:W/2,y:H-110,inv:0,power:1},audio=null,soundOn=false,combo=0,comboTimer=0;
for(let i=0;i<100;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+0.35,r:Math.random()*1.5+.35});
function showOverlay(kind){overlay.classList.remove('hidden');if(kind==='menu'){dialog.innerHTML=`<div class="eyebrow">✦ &nbsp;ARCADE DE SUPERVIVENCIA&nbsp; ✦</div><h1 class="game-title">NEON<br><em>VANGUARD</em></h1><p>La última línea de defensa eres tú.<br>Destruye la flota invasora y sobrevive a sus jefes.</p><button class="play-btn" id="startBtn">INICIAR MISIÓN &nbsp;▶</button><div class="controls-hint"><b>TOCA Y ARRASTRA</b> para pilotar · disparo automático</div>`}else if(kind==='pause'){dialog.innerHTML=`<div class="eyebrow">TRANSMISIÓN EN PAUSA</div><h2 class="game-title" style="font-size:36px">TÓMATE<br><em>UN RESPIRO</em></h2><p>Tu nave está segura… por ahora.</p><button class="play-btn" id="resumeBtn">VOLVER A LA MISIÓN &nbsp;▶</button><div class="controls-hint">PULSA <b>Ⅱ</b> PARA REANUDAR</div>`}else{dialog.innerHTML=`<div class="eyebrow">SEÑAL PERDIDA</div><h2 class="game-title" style="font-size:38px">MISIÓN<br><em>FINALIZADA</em></h2><div class="results"><div><div class="result-num">${String(score).padStart(6,'0')}</div><div class="result-label">PUNTUACIÓN</div></div><div><div class="result-num">${wave}</div><div class="result-label">OLEADA</div></div></div><button class="play-btn" id="startBtn">VOLVER A INTENTAR &nbsp;↻</button><div class="controls-hint">RÉCORD PERSONAL &nbsp;<b>${String(best).padStart(6,'0')}</b></div>`}
if(document.querySelector('#startBtn'))document.querySelector('#startBtn').onclick=startGame;if(document.querySelector('#resumeBtn'))document.querySelector('#resumeBtn').onclick=resumeGame;}
function startGame(){score=0;wave=1;lives=3;shots=[];enemies=[];enemyShots=[];particles=[];pickups=[];boss=null;spawnLeft=8;spawnTimer=.45;fireTimer=0;elapsed=0;combo=0;comboTimer=0;player={x:W/2,y:H-110,inv:1.5,power:1};target={x:W/2,y:H-110};mode='play';overlay.classList.add('hidden');pauseBtn.disabled=false;pauseBtn.textContent='Ⅱ';last=performance.now();}
function pauseGame(){if(mode!=='play')return;mode='pause';pointerDown=false;pauseBtn.textContent='▶';showOverlay('pause');}
function resumeGame(){if(mode!=='pause')return;mode='play';overlay.classList.add('hidden');pauseBtn.textContent='Ⅱ';last=performance.now();}
pauseBtn.onclick=()=>mode==='play'?pauseGame():mode==='pause'?resumeGame():null;
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.style.color=soundOn?C.cyan:'';soundBtn.textContent=soundOn?'♫':'♩';if(soundOn)tone(520,.07,'sine',.025)};
function tone(freq,duration=.08,type='square',volume=.035){if(!soundOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function rand(a,b){return a+Math.random()*(b-a)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function pointerPos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointerDown=true;const p=pointerPos(e);target.x=p.x;target.y=p.y});canvas.addEventListener('pointermove',e=>{if(!pointerDown)return;e.preventDefault();const p=pointerPos(e);target.x=p.x;target.y=p.y});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>pointerDown=false);
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='Escape'||e.key.toLowerCase()==='p'){if(mode==='play')pauseGame();else if(mode==='pause')resumeGame()}if(mode==='play'){const v=6;if(e.key==='ArrowLeft'||e.key==='a')target.x-=v*10;if(e.key==='ArrowRight'||e.key==='d')target.x+=v*10;if(e.key==='ArrowUp'||e.key==='w')target.y-=v*10;if(e.key==='ArrowDown'||e.key==='s')target.y+=v*10}});
function addBurst(x,y,color,n=12,power=1){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rand(35,210)*power;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.8),max:.8,size:rand(1.5,4)*power,color})}}
function spawnEnemy(){const heavy=Math.random()<Math.min(.24,.08+wave*.012),zig=!heavy&&Math.random()<.38;const hp=heavy?3+Math.floor(wave/4):zig?2:1;enemies.push({x:rand(35,W-35),y:-35,hp,max:hp,type:heavy?'heavy':zig?'zig':'scout',phase:rand(0,7),speed:rand(56,90)+wave*4,fire:rand(1.5,3.8),age:0})}
function spawnBoss(){const level=Math.floor(wave/3);boss={x:W/2,y:-105,hp:54+level*20,max:54+level*20,age:0,fire:1.1,phase:0,entering:true};shake=8;flash=.4;tone(110,.5,'sawtooth',.07)}
function nextWave(){wave++;spawnLeft=7+Math.min(7,wave);spawnTimer=1.2;addBurst(W/2,120,C.cyan,24,1.3);tone(740,.2,'triangle',.04);if(wave%3===0){spawnLeft=0;spawnTimer=2.2;boss=null;}}
function playerHit(){if(player.inv>0)return;lives--;player.inv=1.65;shake=12;flash=.26;addBurst(player.x,player.y,C.cyan,26,1.2);tone(125,.35,'sawtooth',.08);combo=0;if(lives<=0){lives=0;mode='over';pauseBtn.disabled=true;best=Math.max(best,score);localStorage.setItem('nvBest',best);showOverlay('over')}}
function destroyEnemy(e){score+=e.type==='heavy'?180:e.type==='zig'?120:80;combo++;comboTimer=2.2;addBurst(e.x,e.y,e.type==='heavy'?C.yellow:C.pink,e.type==='heavy'?23:14,e.type==='heavy'?1.1:.8);tone(e.type==='heavy'?220:330,.07,'square',.025);if(Math.random()<.09)pickups.push({x:e.x,y:e.y,vy:72,age:0});}
function update(dt){elapsed+=dt;if(shake>0)shake=Math.max(0,shake-dt*28);if(flash>0)flash-=dt;if(comboTimer>0)comboTimer-=dt;else combo=0;
for(const s of stars){s.y+= (30+s.z*105)*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}}
if(mode!=='play'){updateFx(dt);return}player.inv=Math.max(0,player.inv-dt);const speed=13*dt;player.x+=clamp(target.x-player.x,-speed*60,speed*60);player.y+=clamp(target.y-player.y,-speed*60,speed*60);player.x=clamp(player.x,24,W-24);player.y=clamp(player.y,H*.47,H-48);
fireTimer-=dt;if(fireTimer<=0){fireTimer=player.power>1?.115:.18;shots.push({x:player.x-9,y:player.y-22,vy:-600,damage:1},{x:player.x+9,y:player.y-22,vy:-600,damage:1});if(player.power>1)shots.push({x:player.x,y:player.y-28,vy:-640,damage:1});tone(660,.035,'square',.012)}
for(const b of shots)b.y+=b.vy*dt;shots=shots.filter(b=>b.y>-20);
if(boss){boss.age+=dt;if(boss.entering){boss.y=Math.min(118,boss.y+90*dt);if(boss.y>=118)boss.entering=false}else{boss.x=W/2+Math.sin(boss.age*.82)*105;boss.y=115+Math.sin(boss.age*1.6)*15;boss.fire-=dt;if(boss.fire<=0){boss.fire=Math.max(.44,1.03-wave*.025);const n=wave>=6?5:3;for(let i=0;i<n;i++){const a=Math.PI*.25+i*(Math.PI*.5/(n-1));enemyShots.push({x:boss.x,y:boss.y+37,vx:Math.cos(a)*125,vy:Math.sin(a)*150+100,r:5})}enemyShots.push({x:boss.x,y:boss.y+32,vx:(player.x-boss.x)*.18,vy:235,r:5});tone(170,.08,'sawtooth',.022)}}}
else{spawnTimer-=dt;if(spawnLeft>0&&spawnTimer<=0){spawnEnemy();spawnLeft--;spawnTimer=Math.max(.35,.88-wave*.025)}if(spawnLeft===0&&enemies.length===0){if(wave%3===0&&wave>1){spawnTimer-=dt;if(spawnTimer<=0&&!boss){spawnBoss()}}else if(!boss)nextWave()}}
for(const e of enemies){e.age+=dt;e.y+=(e.speed+(boss?0:0))*dt;if(e.type==='zig')e.x+=Math.sin(e.age*3+e.phase)*105*dt;e.fire-=dt;if(e.fire<=0&&e.y>0&&e.y<H*.65){e.fire=rand(2,3.8)-Math.min(1,wave*.07);const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;enemyShots.push({x:e.x,y:e.y+12,vx:dx/d*165,vy:dy/d*165,r:4});}}
for(const b of enemyShots){b.x+=b.vx*dt;b.y+=b.vy*dt}
enemyShots=enemyShots.filter(b=>b.y<H+20&&b.x>-20&&b.x<W+20);
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.y>H+30){enemies.splice(i,1);continue}if(Math.hypot(e.x-player.x,e.y-player.y)<23){enemies.splice(i,1);playerHit();continue}for(let j=shots.length-1;j>=0;j--){const b=shots[j];if(Math.abs(b.x-e.x)<(e.type==='heavy'?23:17)&&Math.abs(b.y-e.y)<(e.type==='heavy'?22:17)){shots.splice(j,1);e.hp--;addBurst(b.x,b.y,C.cyan,3,.35);if(e.hp<=0){destroyEnemy(e);enemies.splice(i,1)}break}}}
if(boss){for(let j=shots.length-1;j>=0;j--){const b=shots[j];if(Math.abs(b.x-boss.x)<57&&Math.abs(b.y-boss.y)<37){shots.splice(j,1);boss.hp-=b.damage;addBurst(b.x,b.y,C.cyan,2,.3);if(boss.hp<=0){score+=1800+wave*100;addBurst(boss.x,boss.y,C.pink,80,2.1);shake=20;flash=.5;pickups.push({x:boss.x,y:boss.y,vy:80,age:0,big:true});boss=null;nextWave();tone(860,.35,'triangle',.08)}break}}}
for(const b of enemyShots){if(Math.hypot(b.x-player.x,b.y-player.y)<18){b.y=H+30;playerHit()}}
for(const p of pickups){p.age+=dt;p.y+=p.vy*dt;p.x+=Math.sin(p.age*4)*25*dt;if(Math.hypot(p.x-player.x,p.y-player.y)<27){player.power=Math.min(3,player.power+1);score+=250;addBurst(p.x,p.y,C.yellow,18,1);tone(880,.2,'sine',.05);p.y=H+100}}pickups=pickups.filter(p=>p.y<H+20);
updateFx(dt)}
function updateFx(dt){for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.08,dt);p.vy*=Math.pow(.08,dt);p.life-=dt}particles=particles.filter(p=>p.life>0)}
function polygon(points,fill,stroke=null,width=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function drawShip(x,y,scale=1,color=C.cyan){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.shadowColor=color;ctx.shadowBlur=18;polygon([[0,-24],[-7,-12],[-20,1],[-17,10],[-7,6],[-5,17],[0,13],[5,17],[7,6],[17,10],[20,1],[7,-12]],'#1b394b',color,2);ctx.shadowBlur=9;polygon([[0,-18],[-4,-6],[0,2],[4,-6]],color);ctx.fillStyle='#f8ffff';ctx.fillRect(-2,3,4,5);ctx.shadowBlur=12;ctx.fillStyle=C.pink;ctx.fillRect(-11,9,4,7+Math.sin(elapsed*30)*3);ctx.fillRect(7,9,4,7+Math.cos(elapsed*30)*3);ctx.restore()}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.sin(e.age*2)*.08);const heavy=e.type==='heavy',zig=e.type==='zig',color=heavy?C.yellow:zig?C.cyan:C.pink;ctx.shadowColor=color;ctx.shadowBlur=heavy?17:10;
if(heavy){polygon([[-22,-10],[-14,-19],[14,-19],[22,-10],[18,10],[8,17],[-8,17],[-18,10]],'#382c26',color,2);ctx.fillStyle=color;ctx.fillRect(-11,-7,7,5);ctx.fillRect(4,-7,7,5);ctx.fillRect(-5,5,10,3);ctx.fillStyle='#ffffff22';ctx.fillRect(-15,-15,30,3)}else if(zig){polygon([[0,19],[-21,1],[-14,-13],[-5,-8],[0,-19],[5,-8],[14,-13],[21,1]],'#17343a',color,2);ctx.fillStyle=color;ctx.fillRect(-8,-2,5,4);ctx.fillRect(3,-2,5,4)}else{polygon([[0,19],[-18,1],[-14,-11],[-5,-5],[0,-16],[5,-5],[14,-11],[18,1]],'#351b35',color,2);ctx.fillStyle=color;ctx.fillRect(-7,-3,5,5);ctx.fillRect(3,-3,5,5)}ctx.restore();if(e.hp<e.max){ctx.fillStyle='#ffffff22';ctx.fillRect(e.x-15,e.y-25,30,3);ctx.fillStyle=color;ctx.fillRect(e.x-15,e.y-25,30*e.hp/e.max,3)}}
function drawBoss(){if(!boss)return;ctx.save();ctx.translate(boss.x,boss.y);ctx.shadowColor=C.pink;ctx.shadowBlur=24;polygon([[-64,-19],[-48,-40],[-24,-30],[-12,-45],[12,-45],[24,-30],[48,-40],[64,-19],[55,17],[38,32],[17,25],[0,40],[-17,25],[-38,32],[-55,17]],'#401938',C.pink,3);polygon([[-42,-13],[-29,-22],[-11,-14],[-7,1],[-26,9]],'#1d3448',C.cyan,2);polygon([[42,-13],[29,-22],[11,-14],[7,1],[26,9]],'#1d3448',C.cyan,2);ctx.fillStyle=C.yellow;ctx.fillRect(-28,-11,11,5);ctx.fillRect(17,-11,11,5);ctx.shadowColor=C.yellow;ctx.shadowBlur=15;ctx.fillStyle=C.yellow;ctx.fillRect(-5,3,10,14);ctx.fillStyle=C.pink;ctx.fillRect(-38,17,12,4);ctx.fillRect(26,17,12,4);ctx.restore()}
function drawBackground(){ctx.fillStyle='#080b18';ctx.fillRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#11172c');g.addColorStop(.55,'#0c1022');g.addColorStop(1,'#11152a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(const s of stars){ctx.globalAlpha=.22+s.z*.3;ctx.fillStyle=s.z>1.5?C.cyan:'#c8d6ff';ctx.fillRect(Math.floor(s.x),Math.floor(s.y),s.r,s.r*1.7)}ctx.globalAlpha=1;
ctx.save();ctx.strokeStyle='#29395855';ctx.lineWidth=1;const off=(elapsed*36)%48;for(let y=330+off;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let x=-W;x<W*2;x+=64){ctx.beginPath();ctx.moveTo(W/2+(x-W/2)*.2,330);ctx.lineTo(x,H);ctx.stroke()}ctx.restore();
const glow=ctx.createRadialGradient(W/2,360,0,W/2,360,330);glow.addColorStop(0,'#243b6633');glow.addColorStop(1,'#0c102200');ctx.fillStyle=glow;ctx.fillRect(0,160,W,H-160)}
function drawHUD(){ctx.save();ctx.fillStyle='#080b18aa';ctx.fillRect(0,0,W,74);ctx.strokeStyle='#8595c029';ctx.beginPath();ctx.moveTo(18,73);ctx.lineTo(W-18,73);ctx.stroke();ctx.font='10px "DM Mono",monospace';ctx.fillStyle=C.muted;ctx.fillText('PUNTUACIÓN',20,21);ctx.fillStyle=C.white;ctx.font='19px "DM Mono",monospace';ctx.fillText(String(score).padStart(6,'0'),20,47);ctx.textAlign='center';ctx.font='10px "DM Mono",monospace';ctx.fillStyle=C.muted;ctx.fillText('OLEADA',W/2,21);ctx.fillStyle=C.cyan;ctx.font='18px "DM Mono",monospace';ctx.fillText(String(wave).padStart(2,'0'),W/2,47);ctx.textAlign='right';ctx.font='10px "DM Mono",monospace';ctx.fillStyle=C.muted;ctx.fillText('CASCO',W-20,21);ctx.textAlign='left';for(let i=0;i<3;i++){ctx.beginPath();const x=W-75+i*20;ctx.moveTo(x,39);ctx.lineTo(x+6,31);ctx.lineTo(x+12,39);ctx.lineTo(x+9,47);ctx.lineTo(x+3,47);ctx.closePath();ctx.fillStyle=i<lives?C.pink:'#34405a';ctx.fill();ctx.shadowColor=C.pink;ctx.shadowBlur=i<lives?8:0;ctx.strokeStyle=i<lives?'#ffc0df':'#46516a';ctx.stroke();ctx.shadowBlur=0}ctx.restore();
if(boss){ctx.save();ctx.fillStyle='#111629dd';ctx.fillRect(42,91,396,8);ctx.fillStyle=C.pink;ctx.shadowColor=C.pink;ctx.shadowBlur=12;ctx.fillRect(43,92,394*Math.max(0,boss.hp/boss.max),6);ctx.shadowBlur=0;ctx.textAlign='center';ctx.font='10px "DM Mono",monospace';ctx.fillStyle='#ffc1df';ctx.fillText('NÉMESIS · NAVE INSIGNIA',W/2,87);ctx.restore()}
if(combo>1&&comboTimer>0){ctx.save();ctx.globalAlpha=Math.min(1,comboTimer);ctx.textAlign='center';ctx.fillStyle=C.yellow;ctx.font='bold 14px "DM Mono",monospace';ctx.shadowColor=C.yellow;ctx.shadowBlur=12;ctx.fillText(`${combo}× COMBO`,W/2,H-28);ctx.restore()}}
function draw(){ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));drawBackground();
for(const p of pickups){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(elapsed*2);ctx.shadowColor=C.yellow;ctx.shadowBlur=16;ctx.strokeStyle=C.yellow;ctx.lineWidth=2;ctx.strokeRect(-9,-9,18,18);ctx.rotate(-elapsed*2);ctx.fillStyle=C.yellow;ctx.font='bold 12px "DM Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('+',0,0);ctx.restore()}
for(const b of shots){ctx.save();ctx.shadowColor=C.cyan;ctx.shadowBlur=12;ctx.fillStyle='#d5ffff';ctx.fillRect(b.x-2,b.y-10,4,13);ctx.fillStyle=C.cyan;ctx.fillRect(b.x-1,b.y-7,2,9);ctx.restore()}
for(const b of enemyShots){ctx.save();ctx.shadowColor=C.pink;ctx.shadowBlur=12;ctx.fillStyle='#fff0fa';ctx.beginPath();ctx.arc(b.x,b.y,b.r||4,0,Math.PI*2);ctx.fill();ctx.fillStyle=C.pink;ctx.beginPath();ctx.arc(b.x,b.y,(b.r||4)*.58,0,Math.PI*2);ctx.fill();ctx.restore()}
for(const e of enemies)drawEnemy(e);drawBoss();
for(const p of particles){ctx.save();ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.fillRect(p.x,p.y,p.size,p.size);ctx.restore()}
if(mode==='play'||mode==='pause'){if(player.inv<=0||Math.floor(elapsed*13)%2===0)drawShip(player.x,player.y,1,C.cyan);if(pointerDown&&mode==='play'){ctx.save();ctx.strokeStyle='#5cf4e833';ctx.lineWidth=1;ctx.beginPath();ctx.arc(player.x,player.y,30+Math.sin(elapsed*8)*3,0,Math.PI*2);ctx.stroke();ctx.restore()}}
drawHUD();if(flash>0){ctx.fillStyle=`rgba(255,244,251,${Math.min(.26,flash)})`;ctx.fillRect(0,0,W,H)}ctx.restore()}
function frame(now){const dt=Math.min(.034,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(frame)}
showOverlay('menu');last=performance.now();requestAnimationFrame(frame);
})();
</script>
